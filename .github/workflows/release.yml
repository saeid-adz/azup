name: release

# Push a tag like v2.7.0 (after bumping VERSION in azup.py and pyproject.toml).
# Builds the Python package and the Windows exe, publishes to PyPI (Trusted Publishing, no token)
# and creates the GitHub release with all files attached in one step (releases are immutable).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches VERSION and pyproject
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' azup.py)
          toml=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          echo "tag=$tag azup.py=$py pyproject=$toml"
          [ "$tag" = "$py" ] && [ "$tag" = "$toml" ]
      - name: Changelog has an entry
        run: grep -qxF "## ${GITHUB_REF_NAME#v}" CHANGELOG.md   # exact heading, so a prerelease heading cannot match

  build-python:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/*

  build-exe:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: pyinstaller --onefile --name azup --console azup.py
      - name: Smoke test the exe
        run: |
          .\dist\azup.exe --version
          .\dist\azup.exe status --offline
      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist\azup.exe -Algorithm SHA256).Hash.ToLower() + "  azup.exe" | Out-File -Encoding ascii dist\azup.exe.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe
          path: dist/azup.exe*

  publish-pypi:
    needs: [build-python, build-exe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write       # Trusted Publishing (OIDC), no API token stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: [build-python, build-exe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create release with all assets attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v"$"{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "azup $v" --notes-file notes.md --verify-tag
