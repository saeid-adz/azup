[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "azup-cli"
version = "2.7.0"
description = "Install, update and check your Azure engineering toolbox (Azure CLI, Az PowerShell, Graph, Bicep ...) on Windows, macOS and Linux."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["azure", "cli", "powershell", "graph", "devops"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Installation/Setup",
]

[project.urls]
Homepage = "https://github.com/saeid-adz/azup"
Changelog = "https://github.com/saeid-adz/azup/blob/main/CHANGELOG.md"
Issues = "https://github.com/saeid-adz/azup/issues"

[project.scripts]
azup = "azup:main"

[tool.setuptools]
py-modules = ["azup"]
