[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "azup"
version = "2.0.0"
description = "Install, update and check your Azure engineering toolbox (Azure CLI, Az PowerShell, Graph, Bicep ...) on Windows, macOS and Linux."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["azure", "cli", "powershell", "graph", "devops"]

[project.scripts]
azup = "azup:main"

[tool.setuptools]
py-modules = ["azup"]
